<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1152" height="188" viewBox="0 0 1152 188" aria-labelledby="title desc"><title id="title">Dicter en trois gestes</title><desc id="desc">Appuyez sur Maj gauche, parlez, puis appuyez à nouveau pour insérer votre texte.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#201a14"/><stop offset="1" stop-color="#100f0e"/></linearGradient></defs><rect x="1" y="1" width="1150" height="186" rx="24" fill="url(#bg)" stroke="#5b432b"/><path d="M30 1h100" stroke="#efb75d" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif"><g transform="translate(36 34)"><text fill="#d6a562" font-size="12" font-weight="700" letter-spacing="2">01 · DÉCLENCHER</text><text y="46" fill="#fff2de" font-size="27" font-weight="600">Maj gauche</text><text y="82" fill="#bfa88c" font-size="16">Appuyez puis relâchez.</text></g><g transform="translate(421 34)"><text fill="#d6a562" font-size="12" font-weight="700" letter-spacing="2">02 · DICTER</text><text y="46" fill="#fff2de" font-size="27" font-weight="600">Parlez naturellement</text><text y="82" fill="#bfa88c" font-size="16">Le moteur écoute votre voix.</text></g><g transform="translate(810 34)"><text fill="#d6a562" font-size="12" font-weight="700" letter-spacing="2">03 · TERMINER</text><text y="46" fill="#fff2de" font-size="27" font-weight="600">Maj gauche</text><text y="82" fill="#bfa88c" font-size="16">Votre texte est collé au curseur.</text></g></g><g fill="none" stroke="#c8904b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M350 85h27m-6-6 6 6-6 6M738 85h27m-6-6 6 6-6 6"/></g></svg>